<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Website đang bảo trì — Cell.id.vn</title>
  <!-- Favicon dùng chung toàn ứng dụng -->
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/favicon-64.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/img/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <!-- Trang này KHÔNG gắn /site-status.js (tránh vòng lặp) và không tải CDN/GA:
       thông báo bảo trì phải luôn hiển thị dù mạng ngoài có sự cố. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: radial-gradient(1200px 700px at 15% 0%, #1b2b5e 0%, transparent 60%),
                  radial-gradient(900px 600px at 90% 100%, #0f3f60 0%, transparent 55%),
                  linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e8ecf7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .m-card {
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 36px 32px 30px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
      text-align: center;
    }
    .m-logo {
      display: block;
      width: min(280px, 78%);
      aspect-ratio: 477 / 183;
      margin: 0 auto 18px;
      background: url('/img/logo-white.png') no-repeat center / contain;
    }
    .m-icon {
      width: 58px; height: 58px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 176, 60, 0.16);
      border: 1px solid rgba(255, 176, 60, 0.42);
      color: #ffb43c;
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
    }
    h1 {
      font-size: 23px;
      line-height: 1.35;
      margin-bottom: 14px;
      color: #ffffff;
      letter-spacing: 0.2px;
    }
    .m-message {
      font-size: 15px;
      line-height: 1.75;
      color: #c9d3ea;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px 18px;
      margin: 0 0 18px;
    }
    .m-note {
      font-size: 13.5px;
      line-height: 1.65;
      color: #ffd28a;
      background: rgba(255, 176, 60, 0.1);
      border: 1px solid rgba(255, 176, 60, 0.3);
      border-radius: 10px;
      padding: 10px 14px;
      margin: 0 0 16px;
      text-align: left;
    }
    .m-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .m-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: transparent;
      color: #e8ecf7;
      transition: background 0.2s, transform 0.15s;
    }
    .m-btn:hover { background: rgba(255, 255, 255, 0.09); }
    .m-btn-primary {
      border-color: transparent;
      background: linear-gradient(135deg, #6666ff, #4444cc);
      color: #ffffff;
      box-shadow: 0 8px 22px rgba(100, 100, 255, 0.3);
    }
    .m-btn-primary:hover { background: linear-gradient(135deg, #7474ff, #4d4dd6); transform: translateY(-1px); }
    .m-foot {
      margin-top: 20px;
      font-size: 12px;
      color: #7d87a3;
      line-height: 1.6;
    }
    @media (max-width: 480px) {
      .m-card { padding: 28px 20px 24px; border-radius: 16px; }
      h1 { font-size: 20px; }
      .m-message { font-size: 14px; padding: 14px; }
      .m-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="m-card" role="main" aria-labelledby="mTitle">
    <span class="m-logo" role="img" aria-label="Cell.id.vn"></span>
    <div class="m-icon" aria-hidden="true">!</div>
    <h1 id="mTitle">Website đang bảo trì</h1>
    <div class="m-message">{{MESSAGE}}</div>
    {{NOTE}}
    <div class="m-actions">
      <!-- Không hiển thị nút đăng nhập: đường dẫn /login.html do quản trị viên tự mở. -->
      <a class="m-btn m-btn-primary" href="/">Thử lại</a>
    </div>
    <p class="m-foot">
      Chỉ quản trị viên mới có thể mở lại website trong thời gian bảo trì.<br>
      Cell.id.vn
    </p>
  </main>
</body>
</html>
