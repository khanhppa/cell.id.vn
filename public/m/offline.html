<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111122">
  <meta name="robots" content="noindex">
  <title>Mất kết nối — Cell.id.vn</title>
  <!-- Favicon dùng chung toàn ứng dụng (fav.png) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/favicon-64.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/img/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
  <style>
    /* Cùng bảng màu với /m/app.css (và /theme.css của website). */
    :root {
      --bg: #111122; --bg-2: #15152e; --border: rgba(255,255,255,0.09);
      --text: #e2e2ff; --text-2: #a8a8d0; --text-3: #7a7aa4;
      --brand: #6e6ef7; --brand-2: #4a4ad0;
      --brand-soft: rgba(110,110,247,0.16); --brand-ink: #a9a9ff;
    }
    html[data-theme="light"] {
      --bg: #f0f2f5; --bg-2: #ffffff; --border: rgba(0,0,0,0.10);
      --text: #1a1a2e; --text-2: #44446a; --text-3: #7c7c90;
      --brand: #4444cc; --brand-2: #3333b3;
      --brand-soft: rgba(68,68,204,0.10); --brand-ink: #4444cc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      -webkit-text-size-adjust: 100%;
    }
    .card {
      width: 100%; max-width: 380px; text-align: center;
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px 22px;
    }
    .ico {
      width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      background: var(--brand-soft); color: var(--brand-ink); font-size: 26px;
    }
    h1 { font-size: 19px; margin-bottom: 8px; letter-spacing: -0.2px; }
    p { font-size: 13.5px; line-height: 1.6; color: var(--text-2); }
    button {
      width: 100%; height: 46px; margin-top: 20px; border: 0; border-radius: 10px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:active { transform: scale(0.985); }
    .hint { margin-top: 14px; font-size: 11.5px; color: var(--text-3); }
    /* Logo chính — trang này cũng là một phần của ứng dụng. */
    .brand-offline {
      display: block; width: 160px; aspect-ratio: 477 / 183; margin: 0 auto 14px;
      background: url('/img/logo.png') no-repeat center / contain;
    }
    html[data-theme="dark"] .brand-offline { background-image: url('/img/logo-white.png'); }
  </style>
</head>
<body>
  <div class="card">
    <span class="brand-offline" role="img" aria-label="Cell.id.vn"></span>
    <div class="ico"><i aria-hidden="true">!</i></div>
    <h1>Không có kết nối mạng</h1>
    <p>Ứng dụng cần internet để tra cứu cell và tải lịch sử. Kiểm tra Wi-Fi / dữ liệu di động rồi thử lại.</p>
    <button type="button" onclick="location.reload()">Thử lại</button>
    <p class="hint">Cell.id.vn — bản di động</p>
  </div>
  <script>
    // Tự thử lại khi mạng trở lại.
    window.addEventListener('online', function () { location.reload(); });
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
