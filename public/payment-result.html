<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Chặn trang khi website đang bảo trì (admin vẫn đi qua). Script chặn render. -->
<script src="/site-status.js"></script>
<title>Kết quả thanh toán — Cell Tracker</title>
<!-- Favicon dùng chung toàn ứng dụng (fav.png) -->
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/img/favicon-64.png">
<link rel="icon" type="image/png" sizes="256x256" href="/img/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Bảng màu sáng/tối dùng chung (nguồn DUY NHẤT cho token màu của mọi trang). -->
<link rel="stylesheet" href="/theme.css">
<style>
  /* Token màu lấy từ /theme.css → đồng bộ với trang chủ/navbar/công cụ. */
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-page); color: var(--text-primary); font-size: 14px;
  }
  .container { max-width: 640px; margin: 0 auto; padding: 64px 18px 60px; }
  .card {
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 12px; padding: 26px 22px; text-align: center;
  }
  .res-icon {
    width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center; font-size: 30px;
  }
  .res-icon.paid { background: var(--success-soft); color: var(--ok); }
  .res-icon.pending { background: var(--warning-soft); color: var(--warn); }
  .res-icon.fail { background: var(--danger-soft); color: var(--danger); }
  .res-title { font-size: 20px; font-weight: 800; margin: 0 0 6px; }
  .res-sub { color: var(--text-secondary); font-size: 13px; line-height: 1.6; margin: 0; }
  .rows { text-align: left; margin: 20px 0 0; border-top: 1px solid var(--border-color); }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 10px 2px;
    border-bottom: 1px solid var(--border-color); font-size: 13px;
  }
  .row .k { color: var(--text-secondary); }
  .row .v { margin-left: auto; font-weight: 700; text-align: right; word-break: break-all; }
  .row .v.mono { font-family: monospace; font-weight: 600; }
  .bal-line { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 18px; }
  .bal-num { font-size: 30px; font-weight: 800; color: var(--ok); line-height: 1; }
  .bal-label { color: var(--text-secondary); font-size: 12.5px; }
  .status-badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11.5px; white-space: nowrap; }
  .status-PENDING { background: var(--warning-soft); color: var(--warn); border: 1px solid var(--warning-line); }
  .status-PAID { background: var(--success-soft); color: var(--ok); border: 1px solid var(--success-line); }
  .status-CANCELLED, .status-EXPIRED, .status-FAILED, .status-UNDERPAID {
    background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger-line);
  }
  .btn {
    border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-primary);
    border-radius: 8px; padding: 9px 16px; font-size: 13px; cursor: pointer; font-family: inherit;
    text-decoration: none; display: inline-flex; align-items: center; gap: 7px;
  }
  .btn:hover { background: var(--bg-hover); }
  .btn.primary { background: var(--bg-btn-primary); border-color: var(--bg-btn-primary); color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 22px; }
  .muted { color: var(--text-faint); }
  .error { color: var(--danger); }
  #loading { color: var(--text-faint); text-align: center; padding: 40px 0; }
  .hint { font-size: 12.5px; color: var(--text-secondary); margin-top: 12px; line-height: 1.6; }
  @media (max-width: 480px) { .bal-num { font-size: 26px; } }
</style>
</head>
<body>
<nav class="navbar"></nav>
<div class="container">
  <div class="card">
    <div id="loading"><i class="fas fa-spinner fa-spin"></i> Đang kiểm tra kết quả thanh toán…</div>
    <div id="result" hidden>
      <div class="res-icon" id="resIcon"><i class="fas fa-circle-notch"></i></div>
      <h1 class="res-title" id="resTitle">—</h1>
      <p class="res-sub" id="resSub"></p>

      <div class="bal-line" id="balLine" hidden>
        <i class="fas fa-gem" style="color:var(--ok)"></i>
        <span class="bal-num" id="resBalance">—</span>
        <span class="bal-label">điểm hiện có</span>
      </div>

      <div class="rows">
        <div class="row"><span class="k">Mã đơn</span><span class="v mono" id="resOrder">—</span></div>
        <div class="row"><span class="k">Trạng thái</span><span class="v" id="resStatus">—</span></div>
        <div class="row"><span class="k">Số tiền</span><span class="v" id="resAmount">—</span></div>
        <div class="row"><span class="k">Điểm nạp</span><span class="v" id="resCredits">—</span></div>
        <div class="row" id="resTimeRow"><span class="k">Thời gian trả tiền</span><span class="v" id="resTime">—</span></div>
      </div>

      <p class="hint" id="resHint"></p>

      <div class="actions">
        <a class="btn" href="topup.html"><i class="fas fa-wallet"></i> Nạp đơn khác</a>
        <a class="btn primary" href="credits.html"><i class="fas fa-gem"></i> Về trang điểm</a>
        <button class="btn" id="retryBtn" hidden onclick="loadResult(true)"><i class="fas fa-rotate"></i> Kiểm tra lại</button>
        <a class="btn" id="detailBtn" href="topup.html"><i class="fas fa-receipt"></i> Xem chi tiết đơn</a>
      </div>
    </div>
    <div id="fatal" class="error" hidden></div>
  </div>
</div>

<script src="auth.js"></script>
<script src="version.js"></script>
<script async src="/ga.js"></script>
<script>
// ============================================================================
// Trang kết quả thanh toán payOS (/payment-result.html?order=<code>&status=...)
// payOS redirect về đây sau khi khách trả tiền hoặc huỷ (returnUrl/cancelUrl).
// Điểm CHỈ được cộng bởi webhook /api/payos/webhook (đã verify chữ ký) — trang
// này không tự cộng, chỉ đọc trạng thái đơn và hiển thị.
// ============================================================================
const POLL_TIMEOUT_MS = 90000; // ngừng tự cập nhật sau 90s, để user bấm tay "Kiểm tra lại"
const WAIT_FALLBACK_MS = 4000; // nhịp hỏi khi server không hỗ trợ /wait (bản cũ)
const WAIT_RETRY_MS = 1500;    // nghỉ khi lỗi mạng

const STATUS_TEXT = {
  PENDING: 'Chờ thanh toán', PAID: 'Đã thanh toán', CANCELLED: 'Đã huỷ',
  EXPIRED: 'Hết hạn', UNDERPAID: 'Trả thiếu', FAILED: 'Thất bại'
};

let pollToken = null;    // token vòng long-poll
let pollDeadline = 0;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function fmtVnd(n) { return Number(n || 0).toLocaleString('vi-VN') + 'đ'; }

function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(String(s).replace(' ', 'T') + 'Z');   // SQLite lưu UTC
  if (isNaN(d)) return s;
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function orderCode() {
  const c = parseInt(new URLSearchParams(location.search).get('order'), 10);
  return Number.isFinite(c) ? c : null;
}

function cancelParam() {
  return new URLSearchParams(location.search).get('status') === 'cancel';
}

function stopPoll() { pollToken = null; }

/** Long-poll trạng thái đơn; tự huỷ nếu treo quá lâu (server trả sau ~25s). */
async function fetchOrderWait(code) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 35000);
  try {
    return await Auth.fetch('/api/credits/topup/' + code + '/wait', { signal: ctl.signal });
  } finally { clearTimeout(t); }
}

/**
 * Cập nhật TỨC THÌ: server giữ kết nối và trả về ngay khi webhook payOS đổi trạng
 * thái đơn. Định kỳ (mỗi lượt chờ ~25s) vẫn gọi /sync để đối soát trực tiếp với
 * payOS khi webhook chưa đăng ký. Server cũ (404) → lùi về hỏi mỗi 4 giây.
 */
function startPoll(code) {
  stopPoll();
  pollDeadline = Date.now() + POLL_TIMEOUT_MS;
  const token = {};
  pollToken = token;
  const alive = () => pollToken === token;

  (async () => {
    let waitSupported = true;
    while (alive() && Date.now() <= pollDeadline) {
      let d = null;
      try {
        if (waitSupported) {
          const r = await fetchOrderWait(code);
          if (r.status === 404 || r.status === 405) {
            waitSupported = false;
          } else if (r.status === 429) {
            const j = await r.json().catch(() => ({}));
            await sleep((Number(j && j.retry_after) || 3) * 1000);
            continue;
          } else if (r.ok) {
            d = await r.json();
          }
        }
        if (!waitSupported) {
          d = await fetchOrder(code);
          if (!alive()) return;
          await sleep(WAIT_FALLBACK_MS);
        }
      } catch (e) {
        if (!alive()) return;
        await sleep(WAIT_RETRY_MS);
        continue;
      }
      if (!alive()) return;

      if (d && d.status) {
        render({
          order_code: code, status: d.status, amount_vnd: d.amount_vnd,
          credits: d.credits, paid_at: d.paid_at
        });
        if (d.status !== 'PENDING') return;
      }

      // Vẫn PENDING → nhờ server hỏi thẳng payOS rồi mở lượt chờ kế tiếp.
      if (waitSupported) {
        const s = await syncOrder(code);
        if (!alive()) return;
        if (s && s.status && s.status !== 'PENDING') {
          const fresh = await fetchOrder(code);
          if (fresh && alive()) {
            render({
              order_code: code, status: fresh.status, amount_vnd: fresh.amount_vnd,
              credits: fresh.credits, paid_at: fresh.paid_at
            });
          }
          return;
        }
      }
    }
    stopPoll();   // hết 90s → giữ trạng thái hiện tại, user bấm "Kiểm tra lại"
  })();
}
/** Đổ dữ liệu 1 đơn lên UI. */
function render(o) {
  const st = o.status || 'PENDING';
  document.getElementById('loading').hidden = true;
  document.getElementById('result').hidden = false;

  const icon = document.getElementById('resIcon');
  const title = document.getElementById('resTitle');
  const sub = document.getElementById('resSub');
  const hint = document.getElementById('resHint');

  if (st === 'PAID') {
    icon.className = 'res-icon paid';
    icon.innerHTML = '<i class="fas fa-circle-check"></i>';
    title.textContent = 'Thanh toán thành công';
    sub.textContent = 'Điểm đã được cộng vào tài khoản của bạn.';
    hint.textContent = 'Giao dịch đã ghi vào lịch sử — xem ở mục "Lịch sử giao dịch" trong trang điểm.';
  } else if (st === 'PENDING') {
    icon.className = 'res-icon pending';
    icon.innerHTML = '<i class="fas fa-clock"></i>';
    title.textContent = cancelParam() ? 'Đang kiểm tra lại đơn' : 'Đang chờ thanh toán';
    sub.textContent = 'Hệ thống chưa nhận được xác nhận từ payOS. Trang cập nhật NGAY khi payOS xác nhận (thường 1–5 giây).';
    hint.textContent = 'Nếu bạn đã chuyển khoản, đợi thêm ít phút rồi bấm "Kiểm tra lại" — đôi khi ngân hàng báo muộn.';
  } else {
    const isCancel = st === 'CANCELLED';
    icon.className = 'res-icon fail';
    icon.innerHTML = isCancel ? '<i class="fas fa-ban"></i>' : '<i class="fas fa-circle-xmark"></i>';
    title.textContent = isCancel ? 'Đơn đã huỷ' : (st === 'EXPIRED' ? 'Đơn hết hạn' : 'Thanh toán thất bại');
    sub.textContent = isCancel
      ? 'Bạn (hoặc payOS) đã huỷ đơn nạp này. Chưa có khoản tiền nào bị trừ.'
      : 'Đơn nạp không hoàn tất. Chưa có điểm nào được cộng — bạn có thể tạo đơn mới.';
    hint.textContent = 'Quay lại trang điểm để tạo đơn nạp khác.';
  }

  document.getElementById('resOrder').textContent = '#' + o.order_code;
  document.getElementById('resStatus').innerHTML =
    `<span class="status-badge status-${st}">${STATUS_TEXT[st] || st}</span>`;
  document.getElementById('resAmount').textContent = fmtVnd(o.amount_vnd);
  document.getElementById('resCredits').textContent = (st === 'PAID' ? '+' : '') + o.credits + ' điểm';
  document.getElementById('resTimeRow').hidden = !o.paid_at;
  document.getElementById('resTime').textContent = fmtDate(o.paid_at);
  document.getElementById('detailBtn').href = 'topup.html?order=' + o.order_code;

  // Số dư chỉ hiện khi đã trả tiền (lúc đó webhook đã cộng).
  document.getElementById('balLine').hidden = st !== 'PAID';
  document.getElementById('retryBtn').hidden = st !== 'PENDING';

  if (st === 'PAID') { stopPoll(); loadBalance(); }
  else if (st === 'PENDING') { if (!pollToken) startPoll(o.order_code); }
  else stopPoll();
}

async function loadBalance() {
  try {
    const r = await Auth.fetch('/api/credits/balance');
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('resBalance').textContent = d.balance;
  } catch (e) { /* số dư là thông tin phụ, lỗi thì thôi */ }
}

/** Đọc 1 đơn của chính user. Lỗi → hiện #fatal và trả null. */
async function fetchOrder(code) {
  const r = await Auth.fetch('/api/credits/topup/' + code);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    document.getElementById('loading').hidden = true;
    document.getElementById('fatal').hidden = false;
    document.getElementById('fatal').textContent = d.error || 'Không đọc được thông tin đơn nạp.';
    stopPoll();
    return null;
  }
  document.getElementById('fatal').hidden = true;
  return d;
}

/**
 * Nhờ server đối soát trạng thái với payOS — đường dự phòng khi webhook chưa được
 * đăng ký hoặc chưa gọi tới. Điểm vẫn chỉ được cộng phía server sau khi payOS
 * xác nhận PAID; trang này KHÔNG tự cộng.
 * Lỗi 429/5xx đều bỏ qua im lặng để không làm nhiễu trang kết quả.
 */
async function syncOrder(code) {
  try {
    const r = await Auth.fetch('/api/credits/topup/' + code + '/sync', { method: 'POST' });
    if (!r.ok) return null;
    return await r.json().catch(() => null);
  } catch (e) { return null; }
}

/**
 * Đọc trạng thái 1 lần rồi hiển thị. Có `forceSync` (nút "Kiểm tra lại") thì nhờ
 * server đối soát payOS ngay; còn lại việc cập nhật tức thì do vòng long-poll
 * trong `startPoll()` đảm nhiệm.
 */
async function loadResult(forceSync) {
  const code = orderCode();
  if (code === null) {
    document.getElementById('loading').hidden = true;
    document.getElementById('fatal').hidden = false;
    document.getElementById('fatal').textContent = 'Thiếu mã đơn (?order=) — không xác định được giao dịch.';
    return;
  }
  try {
    let d = await fetchOrder(code);
    if (!d) return;
    if (d.status === 'PENDING' && forceSync) {
      const s = await syncOrder(code);
      if (s && s.status && s.status !== 'PENDING') {
        d = (await fetchOrder(code)) || d;
      }
    }
    render({
      order_code: code, status: d.status, amount_vnd: d.amount_vnd, credits: d.credits,
      paid_at: d.paid_at
    });
  } catch (e) {
    document.getElementById('loading').hidden = true;
    document.getElementById('fatal').hidden = false;
    document.getElementById('fatal').textContent = e.message || 'Lỗi kết nối.';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  if (typeof Auth !== 'undefined' && Auth.initNavbar) Auth.initNavbar();
  if (typeof window.loadTheme === 'function') window.loadTheme();
  if (typeof Auth === 'undefined' || !Auth.isLoggedIn()) {
    if (typeof Auth !== 'undefined' && Auth.goLogin) Auth.goLogin();
    else location.href = 'index.html';
    return;
  }
  // Đối soát payOS ngay lần đầu (webhook có thể tới chậm hơn redirect).
  loadResult(true);
});

// Tab hiện lại → đối soát payOS ngay; vòng long-poll (nếu đang mở) vẫn tự cập nhật.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !document.getElementById('result').hidden) loadResult(true);
});
</script>
</body>
</html>
